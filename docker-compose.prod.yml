# Production compose — runs the full OpsClear stack including the app.
#
# Usage:
#   cp .env.prod.example .env.prod
#   # edit .env.prod — at minimum set APP_HOST (or APP_URL for a domain on the standard port)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Local (alongside dev compose):
#   Default ports are shifted to avoid clashes with docker-compose.yml:
#     Frontend  → http://localhost:8090
#     Keycloak  → http://localhost:8280
#     Portainer → http://localhost:9001
#
# VPS deployment:
#   With a domain on the standard HTTPS port, set APP_URL=https://your.domain in .env.prod
#   (otherwise every URL is built as https://APP_HOST:APP_PORT). TLS setup: docs/dev/DEPLOY.md.

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opsclear
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opsclear}
      POSTGRES_DB: opsclear
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsclear"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: opsclear
      KC_DB_PASSWORD: ${DB_PASSWORD:-opsclear}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Controls the JWT iss claim — must match what the browser uses to reach Keycloak.
      # Routed through nginx's HTTPS port (not the raw :8280 HTTP port) — browsers force
      # an HTTPS upgrade on some TLDs (e.g. .io, via legacy HSTS preload), so an http://
      # link on a hostname like sslip.io gets silently upgraded and then fails outright
      # against a plain-HTTP listener.
      KC_HOSTNAME_URL: ${APP_URL:-https://${APP_HOST:-localhost}:${APP_PORT:-8443}}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8280}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Application ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: opsclear
      DB_USERNAME: opsclear
      DB_PASSWORD: ${DB_PASSWORD:-opsclear}
      # Must equal KC_HOSTNAME_URL + /realms/opsclear so JWT iss validation passes.
      # extra_hosts lets the container resolve APP_HOST=host.docker.internal locally.
      KEYCLOAK_ISSUER_URI: ${APP_URL:-https://${APP_HOST:-localhost}:${APP_PORT:-8443}}/realms/opsclear
      # Allow requests from the frontend origin (nginx HTTPS endpoint).
      CORS_ALLOWED_ORIGINS: ${APP_URL:-https://${APP_HOST:-localhost}:${APP_PORT:-8443}}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      # Transactional email (ADR-0059). Keycloak's own SMTP settings are applied with
      # scripts/keycloak-apply-email.sh.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      # Reply-To and support footer address (ADR-0064). Empty: no Reply-To and no footer.
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_AUTH: ${SMTP_AUTH:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      APP_BASE_URL: ${APP_BASE_URL:-${APP_URL:-https://${APP_HOST:-localhost}:${APP_PORT:-8443}}}
      # Sign-up switch (ADR-0066): false closes organisation creation to all but super users until launch.
      OPSCLEAR_SIGNUP_OPEN: ${OPSCLEAR_SIGNUP_OPEN:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_KEYCLOAK_URL: ${APP_URL:-https://${APP_HOST:-localhost}:${APP_PORT:-8443}}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-opsclear}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-opsclear-frontend}
        VITE_PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
    # 443 serves the app at https://opsclear.app; 8443 is the old port, kept so old
    # https://…sslip.io:8443 links reach nginx and get redirected (see frontend/nginx.conf).
    # APP_URL (or APP_HOST/APP_PORT) only shapes the URLs the app builds; it doesn't pick the
    # published port.
    ports:
      - "80:80"
      - "443:443"
      - "8443:443"
    volumes:
      # Old sslip.io certificate, used only by the redirect for the old address.
      - /etc/nginx/certs:/etc/nginx/certs:ro
      # Let's Encrypt certificate for opsclear.app, and the webroot certbot renews through.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    restart: unless-stopped

  # ── Management ──────────────────────────────────────────────────────────────

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "${PORTAINER_PORT:-9001}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  portainer_data:
