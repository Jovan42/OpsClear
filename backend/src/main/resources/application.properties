spring.application.name=opsclear

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opsclear}
spring.datasource.username=${DB_USERNAME:opsclear}
spring.datasource.password=${DB_PASSWORD:opsclear}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/opsclear}

server.port=${SERVER_PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Paddle (ADR-0044, JOB-171). Blank defaults so the app still boots locally
# without them - actual values come from env vars, never committed here.
# Sandbox during JOB-171-179; a separate live key is a deliberate, later step
# (JOB-180), never a byproduct of this config.
paddle.api-key=${PADDLE_API_KEY:}
paddle.webhook-secret=${PADDLE_WEBHOOK_SECRET:}
paddle.base-url=${PADDLE_BASE_URL:https://sandbox-api.paddle.com}

# Per-API-key rate limit (ADR-0058, JOB-337): burst of `capacity`, then `refill-per-minute`.
# Keys of internal orgs are never limited.
opsclear.rate-limit.enabled=${OPSCLEAR_RATE_LIMIT_ENABLED:true}
opsclear.rate-limit.api-key.capacity=${OPSCLEAR_RATE_LIMIT_API_KEY_CAPACITY:60}
opsclear.rate-limit.api-key.refill-per-minute=${OPSCLEAR_RATE_LIMIT_API_KEY_REFILL_PER_MINUTE:120}

# Transactional email (ADR-0059, JOB-342): Mailpit on localhost:1025 in dev, Brevo SMTP on prod
# (SMTP_* and APP_BASE_URL from docker-compose.prod.yml). Timeouts keep a dead SMTP server from
# tying up the notification executor.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
opsclear.mail.from=${SMTP_FROM:no-reply@opsclear.local}
opsclear.mail.from-name=${SMTP_FROM_NAME:OpsClear}
# Reply-To and support footer address (ADR-0064). Empty: no Reply-To header and no footer.
opsclear.mail.reply-to=${SMTP_REPLY_TO:}
opsclear.app.base-url=${APP_BASE_URL:http://localhost:5173}

# Sign-up switch (ADR-0066): false closes organisation creation to everyone but super users until launch.
# Default open, so dev, tests, CI and the seed script are unchanged.
opsclear.signup.open=${OPSCLEAR_SIGNUP_OPEN:true}

# Free trial (ADR-0067): every new organisation gets `days` of every add-on, capped at `max-members` members and
# `max-projects` active projects. Changing these affects new trials only.
opsclear.trial.days=${OPSCLEAR_TRIAL_DAYS:30}
opsclear.trial.max-members=${OPSCLEAR_TRIAL_MAX_MEMBERS:5}
opsclear.trial.max-projects=${OPSCLEAR_TRIAL_MAX_PROJECTS:3}
# Lock-out switch (ADR-0067 amendment): false until Paddle is live (JOB-432). While false, an org whose trial has
# ended is reported as LOCKED but gets no 402 and keeps add-on access.
opsclear.lockout.enabled=${OPSCLEAR_LOCKOUT_ENABLED:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.info.title=OpsClear API
springdoc.info.description=Operational tracking for small and medium businesses
springdoc.info.version=0.0.1
