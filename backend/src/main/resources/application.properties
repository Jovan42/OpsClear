spring.application.name=opsclear

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opsclear}
spring.datasource.username=${DB_USERNAME:opsclear}
spring.datasource.password=${DB_PASSWORD:opsclear}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/opsclear}

server.port=${SERVER_PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Paddle (ADR-0044, JOB-171). Blank defaults so the app still boots locally
# without them - actual values come from env vars, never committed here.
# Sandbox during JOB-171-179; a separate live key is a deliberate, later step
# (JOB-180), never a byproduct of this config.
paddle.api-key=${PADDLE_API_KEY:}
paddle.webhook-secret=${PADDLE_WEBHOOK_SECRET:}
paddle.base-url=${PADDLE_BASE_URL:https://sandbox-api.paddle.com}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.info.title=OpsClear API
springdoc.info.description=Operational tracking for small and medium businesses
springdoc.info.version=0.0.1
