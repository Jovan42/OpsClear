# Invite email (ADR-0059, JOB-342). MessageFormat: write an apostrophe as ''. UTF-8.
# {0} = inviter name, {1} = organisation name in invite.body; {0} = organisation name in invite.subject.
invite.subject=Pozvani ste da se pridružite organizaciji {0} na OpsClear-u
invite.greeting=Zdravo,
invite.body={0} vas poziva da se pridružite organizaciji {1} na OpsClear-u.
invite.action=Prihvati pozivnicu
# invite.linkIntro is the plain-text part, invite.linkFallback the HTML part (under the button).
invite.linkIntro=Ili otvorite ovaj link da prihvatite pozivnicu:
invite.linkFallback=Ako dugme ne radi, kopirajte ovaj link u pregledač:
invite.expiry=Pozivnica ističe {0}.
invite.ignore=Ako niste očekivali ovu pozivnicu, možete zanemariti ovaj email.
