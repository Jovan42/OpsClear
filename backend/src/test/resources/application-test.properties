spring.datasource.url=jdbc:tc:postgresql:16:///opsclear
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/opsclear

# Fixture secret for webhook signature tests (JOB-174) - tests self-sign payloads
# with this exact value, so no real Paddle webhook secret is needed to run them.
paddle.webhook-secret=test-webhook-secret-fixture

# Run notification fan-out inline (SyncTaskExecutor), so it finishes before the request returns and
# integration tests don't race their own cleanup (JOB-276).
notifications.synchronous=true

# Invite emails go to GreenMail's default test SMTP port (JOB-342). With no GreenMail running the send
# fails fast and is only logged, so tests that don't check email are unaffected.
spring.mail.host=localhost
spring.mail.port=3025
opsclear.app.base-url=http://app.test

# Don't run @Scheduled jobs in tests (JOB-408): SchedulerPoller ticks on a background thread (at startup, then every
# minute, in every cached Spring context sharing the test database) and would process the due schedules the tests
# insert, writing notifications in the middle of a test's cleanup. Tests call the jobs directly.
opsclear.scheduling.enabled=false
