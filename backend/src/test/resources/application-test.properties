spring.datasource.url=jdbc:tc:postgresql:16:///opsclear
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/opsclear

# Fixture secret for webhook signature tests (JOB-174) - tests self-sign payloads
# with this exact value, so no real Paddle webhook secret is needed to run them.
paddle.webhook-secret=test-webhook-secret-fixture

# Run notification fan-out inline (SyncTaskExecutor), so it finishes before the request returns and
# integration tests don't race their own cleanup (JOB-276).
notifications.synchronous=true
