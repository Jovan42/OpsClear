services:
  postgres:
    image: postgres:16
    container_name: opsclear-postgres
    environment:
      POSTGRES_USER: opsclear
      POSTGRES_PASSWORD: opsclear
      POSTGRES_DB: opsclear
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsclear"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
