# OpsClear email theme (ADR-0059, amended 2026-11-17): Keycloak's base email templates with a
# light branded layout (html/template.ftl: white card, "OpsClear" header, inline styles only) and
# the verification and password-reset texts overridden in en and sr (messages/). Those two emails
# show the link as a brand-coloured button, with the raw link under it. html/email-verification.ftl
# and html/password-reset.ftl only skip kcSanitize, which would strip the button's styles.
parent=base
locales=en,sr
