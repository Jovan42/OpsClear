emailVerificationSubject=Potvrdite email adresu za OpsClear
emailVerificationBody=Dobro došli u OpsClear!\n\nPotvrdite svoju email adresu otvaranjem ovog linka:\n\n{0}\n\nLink važi {3}.\n\nAko niste napravili OpsClear nalog, slobodno zanemarite ovaj email.
emailVerificationBodyHtml=<p style="margin:0 0 16px;">Dobro došli u OpsClear!</p><p style="margin:0 0 24px;">Potvrdite svoju email adresu klikom na dugme ispod.</p><p style="margin:0 0 24px;"><a href="{0}" style="display:inline-block; background-color:#059669; color:#ffffff; font-weight:600; text-decoration:none; padding:12px 24px; border-radius:8px;">Potvrdi email adresu</a></p><p style="margin:0 0 16px; font-size:13px; color:#6b7280;">Ako dugme ne radi, kopirajte ovaj link u pregledač:<br><span style="word-break:break-all;">{0}</span></p><p style="margin:0 0 16px;">Link važi {3}.</p><p style="margin:0; font-size:13px; color:#6b7280;">Ako niste napravili OpsClear nalog, slobodno zanemarite ovaj email.</p>

passwordResetSubject=Resetujte lozinku za OpsClear
passwordResetBody=Neko je zatražio promenu lozinke za vaš OpsClear nalog. Ako ste to bili vi, otvorite ovaj link i izaberite novu lozinku:\n\n{0}\n\nLink važi {3}.\n\nAko niste vi zatražili promenu, zanemarite ovaj email i lozinka ostaje ista.
passwordResetBodyHtml=<p style="margin:0 0 24px;">Neko je zatražio promenu lozinke za vaš OpsClear nalog. Ako ste to bili vi, kliknite na dugme ispod i izaberite novu lozinku.</p><p style="margin:0 0 24px;"><a href="{0}" style="display:inline-block; background-color:#059669; color:#ffffff; font-weight:600; text-decoration:none; padding:12px 24px; border-radius:8px;">Resetuj lozinku</a></p><p style="margin:0 0 16px; font-size:13px; color:#6b7280;">Ako dugme ne radi, kopirajte ovaj link u pregledač:<br><span style="word-break:break-all;">{0}</span></p><p style="margin:0 0 16px;">Link važi {3}.</p><p style="margin:0; font-size:13px; color:#6b7280;">Ako niste vi zatražili promenu, zanemarite ovaj email i lozinka ostaje ista.</p>

