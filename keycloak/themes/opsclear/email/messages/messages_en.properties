# OpsClear email texts (ADR-0059). Keycloak formats these with MessageFormat: an apostrophe
# is written '' (so no single quotes in inline styles here), and the placeholders are {0} link,
# {1} expiry in minutes, {2} realm name, {3} formatted expiry ("5 minutes"). Every other email
# falls back to the base theme's texts.
#
# The *BodyHtml texts go inside the html/template.ftl card. Inline styles only: the button is
# an <a> in the brand colour (#059669, login theme's --oc-brand), followed by the raw link for
# clients that block styling.
emailVerificationSubject=Verify your email for OpsClear
emailVerificationBody=Welcome to OpsClear!\n\nPlease confirm your email address by opening this link:\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t create an OpsClear account, you can ignore this email.
emailVerificationBodyHtml=<p style="margin:0 0 16px;">Welcome to OpsClear!</p><p style="margin:0 0 24px;">Please confirm your email address by clicking the button below.</p><p style="margin:0 0 24px;"><a href="{0}" style="display:inline-block; background-color:#059669; color:#ffffff; font-weight:600; text-decoration:none; padding:12px 24px; border-radius:8px;">Verify email address</a></p><p style="margin:0 0 16px; font-size:13px; color:#6b7280;">If the button doesn''t work, copy this link into your browser:<br><span style="word-break:break-all;">{0}</span></p><p style="margin:0 0 16px;">The link expires in {3}.</p><p style="margin:0; font-size:13px; color:#6b7280;">If you didn''t create an OpsClear account, you can ignore this email.</p>

passwordResetSubject=Reset your OpsClear password
passwordResetBody=Someone asked to reset the password of your OpsClear account. If it was you, open this link to choose a new password:\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t ask for this, you can ignore this email and your password stays the same.
passwordResetBodyHtml=<p style="margin:0 0 24px;">Someone asked to reset the password of your OpsClear account. If it was you, click the button below to choose a new password.</p><p style="margin:0 0 24px;"><a href="{0}" style="display:inline-block; background-color:#059669; color:#ffffff; font-weight:600; text-decoration:none; padding:12px 24px; border-radius:8px;">Reset password</a></p><p style="margin:0 0 16px; font-size:13px; color:#6b7280;">If the button doesn''t work, copy this link into your browser:<br><span style="word-break:break-all;">{0}</span></p><p style="margin:0 0 16px;">The link expires in {3}.</p><p style="margin:0; font-size:13px; color:#6b7280;">If you didn''t ask for this, you can ignore this email and your password stays the same.</p>
