# OpsClear email texts (ADR-0059). Keycloak formats these with MessageFormat: an apostrophe
# is written '', and the placeholders are {0} link, {1} expiry in minutes, {2} realm name,
# {3} formatted expiry ("5 minutes"). Every other email falls back to the base theme.
emailVerificationSubject=Verify your email for OpsClear
emailVerificationBody=Welcome to OpsClear!\n\nPlease confirm your email address by opening this link:\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t create an OpsClear account, you can ignore this email.
emailVerificationBodyHtml=<p>Welcome to OpsClear!</p><p>Please confirm your email address by clicking the link below.</p><p><a href="{0}">Verify email address</a></p><p>The link expires in {3}.</p><p>If you didn''t create an OpsClear account, you can ignore this email.</p>

passwordResetSubject=Reset your OpsClear password
passwordResetBody=Someone asked to reset the password of your OpsClear account. If it was you, open this link to choose a new password:\n\n{0}\n\nThe link expires in {3}.\n\nIf you didn''t ask for this, you can ignore this email and your password stays the same.
passwordResetBodyHtml=<p>Someone asked to reset the password of your OpsClear account. If it was you, click the link below to choose a new password.</p><p><a href="{0}">Reset password</a></p><p>The link expires in {3}.</p><p>If you didn''t ask for this, you can ignore this email and your password stays the same.</p>
