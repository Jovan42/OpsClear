# Every string used by login.ftl, register.ftl, login-reset-password.ftl, and
# login-update-password.ftl is defined here explicitly (rather than relying on
# inheriting the parent "keycloak" theme's defaults) so that JOB-126 can add
# messages_sr.properties as a pure translation of this file — no FTL changes.
#
# locale_sr is a display-name override for the language switcher: Keycloak's base
# theme ships locale_xx labels for its own bundled languages, but Serbian isn't one
# of them, so without this the switcher falls back to showing the raw code "sr".
locale_sr=Srpski
loginAccountTitle=Sign in to your account
username=Username
usernameOrEmail=Username or email
email=Email
password=Password
rememberMe=Remember me
doForgotPassword=Forgot Password?
doLogIn=Sign In
noAccount=New user?
doRegister=Register
registerTitle=Register
firstName=First name
lastName=Last name
passwordConfirm=Confirm password
backToLogin=« Back to Login
emailForgotTitle=Forgot Your Password?
doSubmit=Submit
emailInstruction=Enter your username or email address and we will send you instructions on how to create a new password.
emailInstructionUsername=Enter your email address and we will send you instructions on how to create a new password.
updatePasswordTitle=Update password
passwordNew=New password
logoutOtherSessions=Sign out from other devices
doCancel=Cancel
