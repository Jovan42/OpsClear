# Every string used by login.ftl, register.ftl, login-reset-password.ftl,
# login-update-password.ftl, login-verify-email.ftl and info.ftl is defined here explicitly (rather than relying on
# inheriting the parent "keycloak" theme's defaults) so that JOB-126 can add
# messages_sr.properties as a pure translation of this file — no FTL changes.
#
# locale_sr is a display-name override for the language switcher: Keycloak's base
# theme ships locale_xx labels for its own bundled languages, but Serbian isn't one
# of them, so without this the switcher falls back to showing the raw code "sr".
locale_sr=Srpski
loginAccountTitle=Sign in to your account
username=Username
usernameOrEmail=Username or email
email=Email
password=Password
rememberMe=Remember me
doForgotPassword=Forgot Password?
doLogIn=Sign In
noAccount=New user?
doRegister=Register
registerTitle=Register
firstName=First name
lastName=Last name
passwordConfirm=Confirm password
backToLogin=« Back to Login
emailForgotTitle=Forgot Your Password?
doSubmit=Submit
emailInstruction=Enter your username or email address and we will send you instructions on how to create a new password.
emailInstructionUsername=Enter your email address and we will send you instructions on how to create a new password.
updatePasswordTitle=Update password
passwordNew=New password
logoutOtherSessions=Sign out from other devices
doCancel=Cancel

# login-verify-email.ftl and info.ftl (ADR-0059). Keycloak formats these with MessageFormat,
# so an apostrophe is written ''. The keys from emailSentMessage down are Keycloak's own
# message keys, overridden here so they read as OpsClear and have a Serbian translation.
emailVerifyTitle=Verify your email
emailVerifySentTo=We sent a verification link to
emailVerifyNextStep=Open the email and click the link to finish setting up your OpsClear account.
emailVerifyNotReceived=Didn''t get the email?
emailVerifyResend=Resend email
emailSentMessage=You should receive an email shortly with further instructions.
resetPasswordMessage=Choose a new password.
verifyEmailMessage=Verify your email address to activate your account.
confirmEmailAddressVerification=Confirm that {0} is your email address.
emailVerifiedMessage=Your email address has been verified.
emailVerifiedAlreadyMessage=Your email address has already been verified.
accountUpdatedMessage=Your account has been updated.
confirmExecutionOfActions=Complete the following action(s)
requiredAction.VERIFY_EMAIL=Verify email
requiredAction.UPDATE_PASSWORD=Update password
backToApplication=« Back to OpsClear
proceedWithAction=Continue »
