name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      # Changes to this workflow itself run the full pipeline too — a job/step edit
      # here (e.g. e2e-smoke's Keycloak/Postgres wiring) otherwise never triggers at
      # all, since it touches neither backend/** nor frontend/** (bit us on JOB-201's
      # setup-java bump and JOB-205's Keycloak-in-CI job landing with zero real CI
      # signal). Scoped to this file specifically, not the whole .github/workflows/**
      # directory, so a deploy.yml-only change doesn't also trigger this pipeline.
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      # Changes to this workflow itself run the full pipeline too — a job/step edit
      # here (e.g. e2e-smoke's Keycloak/Postgres wiring) otherwise never triggers at
      # all, since it touches neither backend/** nor frontend/** (bit us on JOB-201's
      # setup-java bump and JOB-205's Keycloak-in-CI job landing with zero real CI
      # signal). Scoped to this file specifically, not the whole .github/workflows/**
      # directory, so a deploy.yml-only change doesn't also trigger this pipeline.
      - '.github/workflows/ci.yml'
  # e2e-full only (ADR-0049 §5) — every other job below depends on the `changes`
  # job, which skips entirely on a schedule run (no push/PR diff to filter on), so
  # they all skip too rather than needing their own explicit exclusion.
  schedule:
    - cron: '0 3 * * *'
  # Manual escape hatch for e2e-full (JOB-265) — lets a sharded run be kicked off
  # on demand (e.g. verifying a shard-list change on a branch before merging,
  # rather than waiting for a push to main or the nightly cron) without needing a
  # throwaway push. `changes` still skips (same as `schedule`, no diff to filter
  # on), which is fine — every job gated on it besides e2e-full is irrelevant here.
  workflow_dispatch: {}

jobs:
  changes:
    name: Detect changed paths
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # ci.yml listed under both — every job gated on either output is exactly
          # "everything except deploy.yml", matching a CI-workflow change needing the
          # full pipeline exercised regardless of which specific job it touched.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build (skip tests)
        working-directory: backend
        run: ./gradlew build -x test -x checkstyleMain -x checkstyleTest

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run unit tests
        working-directory: backend
        run: ./gradlew test -PexcludeIntegrationTests jacocoServiceTestReport jacocoServiceCoverageVerification jacocoSecurityTestReport jacocoSecurityCoverageVerification

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: backend/build/test-results/test/**/*.xml
          reporter: java-junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/build/reports/tests/

      - name: Publish unit test coverage (service)
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: backend/build/reports/jacoco/service/jacocoServiceReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit Test Coverage (Service Layer)
          update-comment: true
          min-coverage-overall: 90

      - name: Publish unit test coverage (security)
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: backend/build/reports/jacoco/security/jacocoSecurityReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit Test Coverage (Security Layer)
          update-comment: true
          min-coverage-overall: 90

  integration-tests:
    name: Integration Tests
    needs: [changes, unit-tests]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsclear
          POSTGRES_USER: opsclear
          POSTGRES_PASSWORD: opsclear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run integration tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/opsclear
          SPRING_DATASOURCE_USERNAME: opsclear
          SPRING_DATASOURCE_PASSWORD: opsclear
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: ./gradlew test -PonlyIntegrationTests jacocoTestCoverageVerification

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: backend/build/test-results/test/**/*.xml
          reporter: java-junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/build/reports/tests/

      - name: Publish integration test coverage
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Integration Test Coverage
          update-comment: true
          min-coverage-overall: 90

  lint:
    name: Checkstyle
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Checkstyle
        working-directory: backend
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload Checkstyle results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-results
          path: backend/build/reports/checkstyle/

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # ADR-0049 §5 two-tier split: e2e-smoke runs a small/fast set on every relevant PR;
  # e2e-full runs the entire catalog on merge to main plus nightly. Both scan the same
  # spec-pattern (cypress/e2e/**/*.cy.ts) — the difference is entirely the @smoke tag
  # filter passed to e2e-smoke below (JOB-258): one happy-path test per feature area is
  # tagged `{ tags: '@smoke' }`, so e2e-smoke only runs those, while e2e-full runs
  # every test, tagged or not. New specs should tag their own single clearest
  # happy-path test the same way — see docs/dev/process/E2E.md.
  e2e-smoke:
    name: E2E Smoke
    needs: changes
    # e2e-full already runs the complete untagged catalog (a superset of every
    # @smoke-tagged test) on every push to main, so also running e2e-smoke there is
    # pure duplicate work with zero added coverage — scope this to PRs only (JOB-228,
    # same class of redundancy JOB-258 fixed one layer up).
    if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    # E2E hits a real backend, not mocks, so a backend-only change can still break it
    # (ADR-0049 §5) — hence the `backend == 'true'` half of the gate above too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsclear
          POSTGRES_USER: opsclear
          POSTGRES_PASSWORD: opsclear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-run
        with:
          spec-pattern: 'cypress/e2e/**/*.cy.ts'
          artifact-name: e2e-smoke
          paddle-api-key: ${{ secrets.PADDLE_API_KEY }}
          grep-tags: '@smoke'

  # JOB-265: sharded across 4 parallel matrix jobs instead of one ~35min sequential
  # run — each shard re-provisions its own Keycloak/backend/frontend (fixed ~3-4min
  # cost paid once per shard, not saved by sharding), so wall-clock drops roughly
  # 4-fold while total CI minutes consumed goes up — an accepted tradeoff, since this
  # job never gates a PR (push-to-main/nightly only).
  #
  # Shards are manual, folder-based glob groups, not an auto-balancing tool like
  # cypress-split — this repo has no Cypress Cloud recording to source historical
  # per-test timing from, so "auto-balance by real timing" would mean hand-maintaining
  # a timing file anyway, no simpler than hand-balancing folders directly. Balanced by
  # line count as a proxy for weight at the time of writing (all 4 shards landed
  # within ~2% of each other), with auth-flows/session.cy.ts's real ~5-minute
  # token-refresh wait (JOB-258's own comment) manually weighted heavily so it
  # wouldn't get paired with other heavy specs. A new top-level `cypress/e2e/<area>/`
  # folder needs manually adding to one shard's glob list below (falls into no shard
  # otherwise, silently skipping e2e-full entirely) — the acknowledged tradeoff of
  # picking "simple" over "auto-balancing" here.
  e2e-full:
    name: E2E Full (${{ matrix.shard.name }})
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: shard-1
            # `join(..., ',')` below, not a comma-space-joined string — cypress
            # --spec splits on literal commas and does NOT trim whitespace, so a
            # folded/space-joined list here would silently drop every pattern after
            # the first (confirmed locally: a leading space makes a glob match
            # nothing, and Cypress just warns and moves on rather than failing).
            spec-pattern:
              - cypress/e2e/*.cy.ts
              - cypress/e2e/job-list/**/*.cy.ts
              - cypress/e2e/job-relationships/**/*.cy.ts
              - cypress/e2e/job-types/**/*.cy.ts
              - cypress/e2e/jobs/**/*.cy.ts
              - cypress/e2e/localization/**/*.cy.ts
              - cypress/e2e/status-history/**/*.cy.ts
          - name: shard-2
            spec-pattern:
              - cypress/e2e/auth-flows/**/*.cy.ts
              - cypress/e2e/billing-history/**/*.cy.ts
              - cypress/e2e/cross-cutting-ui/**/*.cy.ts
              - cypress/e2e/golden-path/**/*.cy.ts
              - cypress/e2e/milestones/**/*.cy.ts
              - cypress/e2e/user-settings/**/*.cy.ts
          - name: shard-3
            spec-pattern:
              - cypress/e2e/approvals/**/*.cy.ts
              - cypress/e2e/landing-page/**/*.cy.ts
              - cypress/e2e/links/**/*.cy.ts
              - cypress/e2e/notes/**/*.cy.ts
              - cypress/e2e/organisation-management/**/*.cy.ts
              - cypress/e2e/paddle-checkout/**/*.cy.ts
              - cypress/e2e/super-admin/**/*.cy.ts
          - name: shard-4
            spec-pattern:
              - cypress/e2e/api-keys/**/*.cy.ts
              - cypress/e2e/dashboard/**/*.cy.ts
              - cypress/e2e/job-create-edit/**/*.cy.ts
              - cypress/e2e/job-status/**/*.cy.ts
              - cypress/e2e/job-templates/**/*.cy.ts
              - cypress/e2e/projects/**/*.cy.ts
              - cypress/e2e/recurring-schedules/**/*.cy.ts
              - cypress/e2e/subscription-selection/**/*.cy.ts
    permissions:
      checks: write
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsclear
          POSTGRES_USER: opsclear
          POSTGRES_PASSWORD: opsclear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-run
        with:
          spec-pattern: ${{ join(matrix.shard.spec-pattern, ',') }}
          artifact-name: e2e-full-${{ matrix.shard.name }}
          paddle-api-key: ${{ secrets.PADDLE_API_KEY }}
