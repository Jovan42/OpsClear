name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      # Changes to this workflow itself run the full pipeline too — a job/step edit
      # here (e.g. e2e-smoke's Keycloak/Postgres wiring) otherwise never triggers at
      # all, since it touches neither backend/** nor frontend/** (bit us on JOB-201's
      # setup-java bump and JOB-205's Keycloak-in-CI job landing with zero real CI
      # signal). Scoped to this file specifically, not the whole .github/workflows/**
      # directory, so a deploy.yml-only change doesn't also trigger this pipeline.
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      # Changes to this workflow itself run the full pipeline too — a job/step edit
      # here (e.g. e2e-smoke's Keycloak/Postgres wiring) otherwise never triggers at
      # all, since it touches neither backend/** nor frontend/** (bit us on JOB-201's
      # setup-java bump and JOB-205's Keycloak-in-CI job landing with zero real CI
      # signal). Scoped to this file specifically, not the whole .github/workflows/**
      # directory, so a deploy.yml-only change doesn't also trigger this pipeline.
      - '.github/workflows/ci.yml'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # ci.yml listed under both — every job gated on either output is exactly
          # "everything except deploy.yml", matching a CI-workflow change needing the
          # full pipeline exercised regardless of which specific job it touched.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build (skip tests)
        working-directory: backend
        run: ./gradlew build -x test -x checkstyleMain -x checkstyleTest

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run unit tests
        working-directory: backend
        run: ./gradlew test -PexcludeIntegrationTests jacocoServiceTestReport jacocoServiceCoverageVerification jacocoSecurityTestReport jacocoSecurityCoverageVerification

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: backend/build/test-results/test/**/*.xml
          reporter: java-junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/build/reports/tests/

      - name: Publish unit test coverage (service)
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: backend/build/reports/jacoco/service/jacocoServiceReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit Test Coverage (Service Layer)
          update-comment: true
          min-coverage-overall: 90

      - name: Publish unit test coverage (security)
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: backend/build/reports/jacoco/security/jacocoSecurityReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit Test Coverage (Security Layer)
          update-comment: true
          min-coverage-overall: 90

  integration-tests:
    name: Integration Tests
    needs: [changes, unit-tests]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsclear
          POSTGRES_USER: opsclear
          POSTGRES_PASSWORD: opsclear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run integration tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/opsclear
          SPRING_DATASOURCE_USERNAME: opsclear
          SPRING_DATASOURCE_PASSWORD: opsclear
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: ./gradlew test -PonlyIntegrationTests jacocoTestCoverageVerification

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: backend/build/test-results/test/**/*.xml
          reporter: java-junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/build/reports/tests/

      - name: Publish integration test coverage
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Integration Test Coverage
          update-comment: true
          min-coverage-overall: 90

  lint:
    name: Checkstyle
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Checkstyle
        working-directory: backend
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload Checkstyle results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-results
          path: backend/build/reports/checkstyle/

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e-smoke:
    name: E2E Smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    # E2E hits a real backend, not mocks, so a backend-only change can still break it
    # (ADR-0049 §5) — hence the `backend == 'true'` half of the gate above too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsclear
          POSTGRES_USER: opsclear
          POSTGRES_PASSWORD: opsclear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Run directly via `docker run`, not a `services:` entry — GitHub Actions
      # service containers have no way to pass a command/CMD (only `image`, `env`,
      # `ports`, and `options`, the last of which maps to `docker create` flags, not
      # positional args), and Keycloak's image requires `start-dev` as an explicit
      # argument to actually launch — with none given it just prints help and exits.
      # No KC_DB env vars here (unlike docker-compose's Postgres-backed Keycloak) —
      # `start-dev` falls back to its own ephemeral dev-file store, which is all this
      # job needs; provisioning a second `keycloak` database on the Postgres service
      # above just to mirror local dev exactly would add setup cost for no behavioral
      # difference in what's being tested here.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8180:8080 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:24.0 start-dev

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 30); do
            if curl -sf -X POST "http://localhost:8180/realms/master/protocol/openid-connect/token" \
                -d "client_id=admin-cli&username=admin&password=admin&grant_type=password" -o /dev/null; then
              echo "Keycloak is ready"
              exit 0
            fi
            echo "Waiting for Keycloak... ($i/30)"
            sleep 2
          done
          echo "Keycloak did not become ready in time" >&2
          exit 1

      # Realm import via the Admin REST API, not the --import-realm/volume-mount
      # pattern docker-compose uses locally — GitHub Actions service containers start
      # before `actions/checkout`, so there's no repo file on disk yet to bind-mount
      # into the container at that point. This sidesteps that ordering problem
      # entirely: both Keycloak and the checked-out repo are already available by the
      # time this step runs. Confirmed the realm needs no CI-specific changes —
      # `opsclear-frontend`'s redirect URIs/web origins already include
      # `http://localhost:5173`, and every process here (Keycloak, backend, frontend)
      # runs on the same runner's `localhost`, exactly like local dev's networking
      # model, just without Docker Compose's service-name hostnames (JOB-205's own
      # "confirm no local-only settings block import" check).
      #
      # The realm's `loginTheme: opsclear` custom theme isn't mounted here (that's
      # local dev's `keycloak/themes` volume) — Keycloak falls back to its built-in
      # theme when a named one isn't found, which is fine for this job (only the
      # token-grant bypass is exercised, no login page is ever rendered). Wiring the
      # real theme into CI is JOB-208's concern, which actually renders it.
      - name: Import Keycloak realm
        run: |
          ADMIN_TOKEN=$(curl -sf -X POST "http://localhost:8180/realms/master/protocol/openid-connect/token" \
            -d "client_id=admin-cli&username=admin&password=admin&grant_type=password" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          curl -sf -X POST "http://localhost:8180/admin/realms" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d @keycloak/realm-export.json

          # The static export only seeds `testuser@example.com` — alice/bob/carol/dave
          # are created dynamically by scripts/seed.sh's own create_kc_user, mirrored
          # here rather than running that script wholesale (it also truncates/reseeds
          # Postgres via `docker exec <container-name>`, which doesn't translate to a
          # GitHub Actions service container's auto-generated name — a concern for
          # whichever backfill job first needs real seeded org/project fixtures in CI,
          # not this one).
          create_kc_user() {
            curl -sf -o /dev/null -X POST "http://localhost:8180/admin/realms/opsclear/users" \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"$3\",\"email\":\"$3\",\"firstName\":\"$1\",\"lastName\":\"$2\",\"enabled\":true,\"emailVerified\":true,\"credentials\":[{\"type\":\"password\",\"value\":\"password123\",\"temporary\":false}]}"
          }
          create_kc_user "Alice" "Webb"   "alice@example.com"
          create_kc_user "Bob"   "Harris" "bob@example.com"
          create_kc_user "Carol" "Marsh"  "carol@example.com"
          create_kc_user "Dave"  "Santos" "dave@example.com"

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/opsclear
          SPRING_DATASOURCE_USERNAME: opsclear
          SPRING_DATASOURCE_PASSWORD: opsclear
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: nohup ./gradlew bootRun > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health -o /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become ready in time" >&2
          cat backend/backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev > frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 -o /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend did not become ready in time" >&2
          cat frontend/frontend.log
          exit 1

      # Only the infrastructure-proving specs for now (JOB-205's own scope) — the full
      # feature-area catalog and the e2e-smoke/e2e-full split by trigger is JOB-206.
      - name: Run Cypress
        working-directory: frontend
        run: npx cypress run --spec "cypress/e2e/smoke.cy.ts,cypress/e2e/login-as-command.cy.ts"

      - name: Upload Cypress artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-e2e-smoke-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore
