name: Run Cypress E2E suite
description: >
  Provisions Keycloak + backend + frontend against the job's own Postgres service
  (which must already be declared on the calling job — composite actions can't declare
  `services:` themselves), then runs the given Cypress spec pattern. Shared by
  e2e-smoke and e2e-full (JOB-206) so the two jobs don't duplicate this ~130-line
  sequence verbatim. Assumes `actions/checkout` already ran in the calling job — a
  local composite action has to be checked out before it can be invoked at all.

inputs:
  spec-pattern:
    description: Cypress --spec value (comma-separated globs)
    required: true
  artifact-name:
    description: Name for the uploaded screenshots/videos artifact on failure
    required: true
  paddle-api-key:
    description: Forwarded to the backend process — composite actions don't inherit the caller's `secrets` context automatically
    required: false
    default: ''
  grep-tags:
    description: >
      Optional @cypress/grep tag filter (e.g. "@smoke"), passed through as
      `--expose grepTags=<value>` (JOB-258). Both jobs scan the same spec-pattern —
      this narrows which tests *inside* those specs actually run, without needing a
      separate glob. Left empty runs every test in every matched spec, tagged or not.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Run directly via `docker run`, not a `services:` entry — GitHub Actions service
    # containers have no way to pass a command/CMD (only `image`, `env`, `ports`, and
    # `options`, the last of which maps to `docker create` flags, not positional
    # args), and Keycloak's image requires `start-dev` as an explicit argument to
    # actually launch — with none given it just prints help and exits. No KC_DB env
    # vars here (unlike docker-compose's Postgres-backed Keycloak) — `start-dev` falls
    # back to its own ephemeral dev-file store, which is all this needs; provisioning
    # a second `keycloak` database on the calling job's Postgres service just to
    # mirror local dev exactly would add setup cost for no behavioral difference in
    # what's being tested.
    - name: Start Keycloak
      shell: bash
      run: |
        docker run -d --name keycloak \
          -p 8180:8080 \
          -e KEYCLOAK_ADMIN=admin \
          -e KEYCLOAK_ADMIN_PASSWORD=admin \
          quay.io/keycloak/keycloak:24.0 start-dev

    - name: Wait for Keycloak
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if curl -sf -X POST "http://localhost:8180/realms/master/protocol/openid-connect/token" \
              -d "client_id=admin-cli&username=admin&password=admin&grant_type=password" -o /dev/null; then
            echo "Keycloak is ready"
            exit 0
          fi
          echo "Waiting for Keycloak... ($i/30)"
          sleep 2
        done
        echo "Keycloak did not become ready in time" >&2
        exit 1

    # Realm import via the Admin REST API, not the --import-realm/volume-mount pattern
    # docker-compose uses locally — a manually-`docker run` container (like a
    # `services:` one) starts before the repo needed for a volume mount is
    # necessarily positioned the same way locally, and Admin-API import is more
    # portable regardless. Confirmed the realm needs no CI-specific changes (JOB-205)
    # — `opsclear-frontend`'s redirect URIs/web origins already include
    # `http://localhost:5173`, and every process here (Keycloak, backend, frontend)
    # runs on the same runner's `localhost`, exactly like local dev's networking
    # model, just without Docker Compose's service-name hostnames.
    #
    # The realm's `loginTheme: opsclear` custom theme isn't mounted here (that's local
    # dev's `keycloak/themes` volume) — Keycloak falls back to its built-in theme when
    # a named one isn't found, which only matters once a spec actually renders the
    # login page (JOB-208).
    - name: Import Keycloak realm
      shell: bash
      run: |
        ADMIN_TOKEN=$(curl -sf -X POST "http://localhost:8180/realms/master/protocol/openid-connect/token" \
          -d "client_id=admin-cli&username=admin&password=admin&grant_type=password" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

        curl -sf -X POST "http://localhost:8180/admin/realms" \
          -H "Authorization: Bearer $ADMIN_TOKEN" \
          -H "Content-Type: application/json" \
          -d @keycloak/realm-export.json

        # The static export only seeds `testuser@example.com` — alice/bob/carol/dave
        # are created dynamically by scripts/seed.sh's own create_kc_user, mirrored
        # here rather than running that script wholesale (it also truncates/reseeds
        # Postgres via `docker exec <container-name>`, which doesn't translate to a
        # GitHub Actions service container's auto-generated name — a concern for
        # whichever backfill job first needs real seeded org/project fixtures in CI,
        # not this one).
        create_kc_user() {
          curl -sf -o /dev/null -X POST "http://localhost:8180/admin/realms/opsclear/users" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$3\",\"email\":\"$3\",\"firstName\":\"$1\",\"lastName\":\"$2\",\"enabled\":true,\"emailVerified\":true,\"credentials\":[{\"type\":\"password\",\"value\":\"password123\",\"temporary\":false}]}"
        }
        create_kc_user "Alice" "Webb"   "alice@example.com"
        create_kc_user "Bob"   "Harris" "bob@example.com"
        create_kc_user "Carol" "Marsh"  "carol@example.com"
        create_kc_user "Dave"  "Santos" "dave@example.com"

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x backend/gradlew

    - name: Start backend
      shell: bash
      working-directory: backend
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/opsclear
        SPRING_DATASOURCE_USERNAME: opsclear
        SPRING_DATASOURCE_PASSWORD: opsclear
        SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        PADDLE_API_KEY: ${{ inputs.paddle-api-key }}
      run: nohup ./gradlew bootRun > backend.log 2>&1 &

    - name: Wait for backend
      shell: bash
      run: |
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/api/health -o /dev/null; then
            echo "Backend is ready"
            exit 0
          fi
          echo "Waiting for backend... ($i/60)"
          sleep 2
        done
        echo "Backend did not become ready in time" >&2
        cat backend/backend.log
        exit 1

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Start frontend
      shell: bash
      working-directory: frontend
      run: nohup npm run dev > frontend.log 2>&1 &

    - name: Wait for frontend
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5173 -o /dev/null; then
            echo "Frontend is ready"
            exit 0
          fi
          echo "Waiting for frontend... ($i/30)"
          sleep 2
        done
        echo "Frontend did not become ready in time" >&2
        cat frontend/frontend.log
        exit 1

    - name: Run Cypress
      shell: bash
      working-directory: frontend
      run: |
        if [ -n "${{ inputs.grep-tags }}" ]; then
          npx cypress run --spec "${{ inputs.spec-pattern }}" --expose grepTags="${{ inputs.grep-tags }}"
        else
          npx cypress run --spec "${{ inputs.spec-pattern }}"
        fi

    - name: Publish E2E test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: E2E Test Results (${{ inputs.artifact-name }})
        path: frontend/cypress/results/*.xml
        reporter: java-junit

    - name: Upload Cypress artifacts
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-${{ inputs.artifact-name }}-artifacts
        path: |
          frontend/cypress/screenshots
          frontend/cypress/videos
        if-no-files-found: ignore
