# Per-IP rate limits (ADR-0058). This file is included at http level, so zones go here.
limit_req_zone $binary_remote_addr zone=api_ip:10m     rate=20r/s;
limit_req_zone $binary_remote_addr zone=paddle_hook:1m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

# ISO-8601 timestamp ending in Z (like the backend's) when nginx runs in UTC.
map $time_iso8601 $rate_limit_ts {
    ~^(.*)\+00:00$ "$1Z";
    default        $time_iso8601;
}

# Port 80: answers Let's Encrypt's HTTP-01 challenge (certbot writes the files to the host's
# /var/www/certbot, mounted here) and sends everything else to HTTPS.
server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Old address (sslip.io / bare IP, reachable on 443 and on the legacy 8443 port): permanent
# redirect to the domain, so old links and bookmarks keep working. Uses the old certificate.
server {
    listen 443 ssl;
    server_name 46-101-205-77.sslip.io 46.101.205.77;

    ssl_certificate     /etc/nginx/certs/opsclear.crt;
    ssl_certificate_key /etc/nginx/certs/opsclear.key;

    return 301 https://opsclear.app$request_uri;
}

# www → the bare domain.
server {
    listen 443 ssl;
    server_name www.opsclear.app;

    ssl_certificate     /etc/letsencrypt/live/opsclear.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsclear.app/privkey.pem;

    return 301 https://opsclear.app$request_uri;
}

# The app. default_server, so requests by IP or an unknown name (including the container's own
# health check on https://127.0.0.1/) land here rather than on a redirect.
server {
    listen 443 ssl default_server;
    server_name opsclear.app;

    ssl_certificate     /etc/letsencrypt/live/opsclear.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opsclear.app/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Rate-limited requests get the app's JSON error shape (ADR-0058).
    error_page 429 = @rate_limited;

    location @rate_limited {
        add_header   Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"Too Many Requests","message":"Too many requests. Slow down and try again shortly.","timestamp":"$rate_limit_ts"}';
    }

    # Notification SSE stream (ADR-0051): long-lived, so no buffering and a read timeout past the
    # backend's 30-minute stream lifetime (heartbeats every 25 s keep it from idling out).
    location /api/notifications/stream {
        proxy_pass         http://backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 35m;
    }

    # API reverse proxy — forwards to backend container on the Docker network, per-IP backstop
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        limit_req          zone=api_ip burst=200 nodelay;
    }

    # Paddle webhook: tighter limit. A location with its own limit_req doesn't inherit the parent's.
    location = /api/webhooks/paddle {
        proxy_pass         http://backend:8080/api/webhooks/paddle;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        limit_req          zone=paddle_hook burst=20 nodelay;
    }

    # Health check: monitors poll it, so no limit
    location = /api/health {
        proxy_pass         http://backend:8080/api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger UI — optional, remove in production if not needed
    location /swagger-ui/ {
        proxy_pass         http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /api-docs {
        proxy_pass         http://backend:8080/api-docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Keycloak proxy — browser reaches Keycloak over HTTPS via nginx
    location /realms/ {
        proxy_pass             http://keycloak:8080/realms/;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_next_upstream    error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location /resources/ {
        proxy_pass         http://keycloak:8080/resources/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
