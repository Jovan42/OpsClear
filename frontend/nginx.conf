# Per-IP rate limits (ADR-0058). This file is included at http level, so zones go here.
limit_req_zone $binary_remote_addr zone=api_ip:10m     rate=20r/s;
limit_req_zone $binary_remote_addr zone=paddle_hook:1m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/opsclear.crt;
    ssl_certificate_key /etc/nginx/certs/opsclear.key;

    root /usr/share/nginx/html;
    index index.html;

    # Rate-limited requests get the app's JSON error shape (ADR-0058).
    error_page 429 = @rate_limited;

    location @rate_limited {
        add_header   Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"Too Many Requests","message":"Too many requests. Slow down and try again shortly.","timestamp":"$time_iso8601"}';
    }

    # Notification SSE stream (ADR-0051): long-lived, so no buffering and a read timeout past the
    # backend's 30-minute stream lifetime (heartbeats every 25 s keep it from idling out).
    location /api/notifications/stream {
        proxy_pass         http://backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 35m;
    }

    # API reverse proxy — forwards to backend container on the Docker network, per-IP backstop
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        limit_req          zone=api_ip burst=200 nodelay;
    }

    # Paddle webhook: tighter limit. A location with its own limit_req doesn't inherit the parent's.
    location = /api/webhooks/paddle {
        proxy_pass         http://backend:8080/api/webhooks/paddle;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        limit_req          zone=paddle_hook burst=20 nodelay;
    }

    # Health check: monitors poll it, so no limit
    location = /api/health {
        proxy_pass         http://backend:8080/api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger UI — optional, remove in production if not needed
    location /swagger-ui/ {
        proxy_pass         http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /api-docs {
        proxy_pass         http://backend:8080/api-docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Keycloak proxy — browser reaches Keycloak over HTTPS via nginx
    location /realms/ {
        proxy_pass             http://keycloak:8080/realms/;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_next_upstream    error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location /resources/ {
        proxy_pass         http://keycloak:8080/resources/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
