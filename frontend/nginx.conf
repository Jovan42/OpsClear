server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/opsclear.crt;
    ssl_certificate_key /etc/nginx/certs/opsclear.key;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — forwards to backend container on the Docker network
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Swagger UI — optional, remove in production if not needed
    location /swagger-ui/ {
        proxy_pass         http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /api-docs {
        proxy_pass         http://backend:8080/api-docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Keycloak proxy — browser reaches Keycloak over HTTPS via nginx
    location /realms/ {
        proxy_pass         http://keycloak:8080/realms/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass         http://keycloak:8080/resources/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
